# The dbt project: SQL transformations as versioned, tested code.
name: lakehouse
version: "1.0.0"
profile: lakehouse

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lakehouse:
    staging:
      +materialized: view    # staging = thin renames/casts; views cost nothing
    marts:
      +materialized: table   # marts = what analysts query; tables are fast
