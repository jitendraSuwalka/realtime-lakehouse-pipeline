# ---------------------------------------------------------------------------
# Local infrastructure for the lakehouse pipeline.
# Phase 0: Kafka (the event broker) + Kafka UI (a browser window into Kafka).
# Phase 1: LocalStack - a local AWS emulator providing the S3 API.
#          (Originally MinIO; swapped mid-build when MinIO's public images
#          became unavailable on both Docker Hub and quay.io. LocalStack's
#          `latest` then demanded a licence token, so we pin the 3.8
#          community release - two vendor lessons in why images get pinned.)
# Phase 2: spark-job - batch Spark runner for the silver layer
#          (`docker compose run --rm spark-job`).
# Phase 3: postgres - the warehouse (stands in for Redshift until Phase 6),
#          and dbt - built from docker/dbt.Dockerfile, run on demand:
#          `docker compose run --rm dbt run` / `... dbt test`.
#
#   start:  docker compose up -d
#   stop:   docker compose stop     (keeps containers + their data)
#   reset:  docker compose down     (removes containers - full fresh start)
#   status: docker compose ps
# ---------------------------------------------------------------------------
services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: lakehouse-kafka
    ports:
      - "9092:9092"          # reachable from your laptop as localhost:9092
    environment:
      # Single-node Kafka in modern KRaft mode (no ZooKeeper needed).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two doors into Kafka:
      #   - INTERNAL (kafka:19092)  → for other containers, e.g. Kafka UI
      #   - EXTERNAL (localhost:9092) → for scripts running on your laptop
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: lakehouse-kafka-ui
    ports:
      - "8080:8080"          # open http://localhost:8080 in your browser
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  localstack:
    # Local AWS emulator - we use its S3 service as the lake's object store.
    # Any access key/secret is accepted (it's an emulator); only the
    # endpoint matters. Pinned to 3.8: the last line of free community
    # releases before `latest` started requiring a licence token.
    # Note: data does not persist across 'docker compose down' -
    # scripts/init_s3.py recreates the bucket in seconds, and bronze can
    # always be re-landed from Kafka. Day to day, prefer 'stop' over 'down'.
    image: localstack/localstack:3.8
    container_name: lakehouse-localstack
    ports:
      - "4566:4566"          # the AWS API gateway -> http://localhost:4566
    environment:
      SERVICES: s3           # only start S3 - keeps it light

  spark-job:
    # Batch Spark runner for the silver layer (and later jobs).
    # Why a container and not `pip install pyspark`? Two honest reasons:
    #   1. Our laptop Python (3.14) is newer than PySpark supports - the
    #      container ships its own compatible Python and Java.
    #   2. Production Spark runs on clusters/containers anyway; this mirrors
    #      that shape in miniature (local[2] = Spark's local mode, 2 cores).
    # Run it:   docker compose run --rm spark-job
    image: apache/spark:3.5.1
    profiles: ["jobs"]       # excluded from `docker compose up -d`
    user: "0:0"              # dev convenience: avoids volume-permission issues
    depends_on:
      - localstack
    environment:
      S3_ENDPOINT: http://localstack:4566   # service name, NOT localhost -
      S3_ACCESS_KEY: minioadmin             # containers reach each other by
      S3_SECRET_KEY: minioadmin             # compose DNS name
      BUCKET: lakehouse
    volumes:
      - ./src/silver:/opt/job:ro            # the job code, read-only
      - ./data/ivy:/tmp/.ivy                # cache the S3 connector jars
                                            # (first run downloads ~300 MB;
                                            #  cached after that)
    command: >
      /opt/spark/bin/spark-submit
      --master local[2]
      --packages org.apache.hadoop:hadoop-aws:3.3.4
      --conf spark.jars.ivy=/tmp/.ivy
      --conf spark.ui.showConsoleProgress=false
      /opt/job/silver_job.py

  postgres:
    # The warehouse. Locally it's Postgres; in Phase 6 the same dbt models
    # run against Redshift Serverless - dbt makes that a profile change.
    image: postgres:16
    container_name: lakehouse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse       # dev-only credentials
      POSTGRES_DB: lakehouse
    volumes:
      - ./data/postgres:/var/lib/postgresql/data   # survives restarts,
                                                   # gitignored like all data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  dbt:
    # dbt runner, built from our own small Dockerfile (Python 3.12 inside -
    # same laptop-Python-too-new story as Spark). Run on demand:
    #   docker compose run --rm dbt run
    #   docker compose run --rm dbt test
    build:
      context: docker
      dockerfile: dbt.Dockerfile
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_HOST: postgres
    volumes:
      - ./dbt:/usr/app                   # the dbt project
      - ./dbt/profiles:/root/.dbt        # where dbt looks for profiles.yml
